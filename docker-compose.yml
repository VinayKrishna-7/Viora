version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: viora-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: viora
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - viora-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: viora-server
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/viora
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-your_random_secret_here}
      JWT_EXPIRE: 7d
      MEDIA_STORAGE_PROVIDER: local
      UPLOAD_DIR: ./uploads
    volumes:
      - media_uploads:/app/uploads
    networks:
      - viora-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: viora-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3000:80"
    networks:
      - viora-net

volumes:
  mongodb_data:
  media_uploads:

networks:
  viora-net:
    driver: bridge
